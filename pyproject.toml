[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "templateer"
version = "0.3.2"
description = "A Pythoninc Pydantic ⇄ Jinja toolkit"
readme = "README.md"
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.12.4",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
dev = [
    "templateer[test]",
    "ruff>=0.1.0",
]

[project.scripts]
mpt = "templateer.cli:app"

[project.urls]
Homepage = "https://github.com/Bullish-Design/templateer"
Repository = "https://github.com/Bullish-Design/templateer"

[tool.ruff]
line-length = 120
target-version = "py313"
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (skipped without env)",
]
filterwarnings = "ignore::DeprecationWarning"

[tool.hatch.build.targets.wheel]
packages = ["src/templateer"]
